# The demo site on GitHub Pages: the real page (web/) with demo/demo.js answering /api/* in the browser, built by
# demo/build.mjs. It's published only after Tests has passed on main, from that same commit, so the demo is
# always the current page and never a broken one.
#
# So that one bad run can't leave the demo behind main until the next push (a package mirror once hung main's
# WebKit job until it was cancelled): when Tests on main's latest commit doesn't pass, its failed jobs are run once
# more, and passing then publishes as usual. Only main's latest commit is published or retried, so a run that
# finishes late never puts an older page over a newer one.
name: Demo
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  latest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      yes: ${{ steps.c.outputs.yes }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
          echo "main is at $head; this run is for $SHA"
          echo "yes=$([ "$head" = "$SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  retry:
    needs: latest
    if: needs.latest.outputs.yes == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
  build:
    needs: latest
    if: needs.latest.outputs.yes == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # main itself (github.sha is main's latest commit for workflow_run), never a ref taken from the event, then a
      # check that it's the commit Tests passed on: if main moved on meanwhile, that commit's own run publishes.
      - uses: actions/checkout@v7
      - env:
          WANT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          have=$(git rev-parse HEAD)
          [ "$have" = "$WANT" ] || { echo "::error::checked out $have, but Tests ran on $WANT (main moved on); the newer commit's run will publish"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts   # the libraries, so the demo serves its own copies (lib/); no install scripts in a job that can publish
      - run: node demo/build.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
