# Every test (tests/run_all.py) on each push and pull request: the real server with fake Claude Code / Anthropic /
# OpenAI (tests/fakes/), and the page in headless Chromium. Nothing here talks to a real model or needs a secret.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # the libraries the page loads from CDNs; the tests serve them from node_modules
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/run_all.py
      - name: Keep the logs and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: tests/.artifacts/
          include-hidden-files: true   # .artifacts starts with a dot
          retention-days: 7
