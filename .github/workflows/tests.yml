# Every test (tests/run_all.py) on each push and pull request: the real server with fake Claude Code / Anthropic /
# OpenAI (tests/fakes/), and the page in headless Chromium and, side by side, in WebKit (Safari's engine: an iPad,
# an iPhone; DIGRESS_BROWSER in tests/common.py). Nothing here talks to a real model or needs a secret.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.browser }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Prebuilt Playwright image has Chromium, WebKit, and all system libraries pre-installed (skips apt-get + browser downloads).
    # Keep the tag in step with tests/webkit/Containerfile.
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false   # a failure in one engine doesn't cancel the other
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    env:
      DIGRESS_BROWSER: ${{ matrix.browser }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # the libraries the page loads from CDNs; the tests serve them from node_modules
      - run: pip install --no-cache-dir --break-system-packages playwright==1.65.0
      - run: python3 tests/run_all.py -j 2 --shard ${{ matrix.shard }}/4
      - name: Keep the logs and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/.artifacts/
          include-hidden-files: true   # .artifacts starts with a dot
          retention-days: 7
