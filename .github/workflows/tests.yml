# Every test (tests/run_all.py) on each push and pull request: the real server with fake Claude Code / Anthropic /
# OpenAI (tests/fakes/), and the page in headless Chromium and, side by side, in WebKit (Safari's engine: an iPad,
# an iPhone; DIGRESS_BROWSER in tests/common.py). Nothing here talks to a real model or needs a secret.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false   # a failure in one engine doesn't cancel the other
      matrix:
        browser: [chromium, webkit]
    env:
      DIGRESS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # the libraries the page loads from CDNs; the tests serve them from node_modules
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      # A package mirror once stalled mid-download for the job's whole 30 minutes (apt waits forever by default), so
      # main's run was cancelled and the demo wasn't published: give up on a slow download and try it again instead
      - run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 12
      - run: python tests/run_all.py
      - name: Keep the logs and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.browser }}
          path: tests/.artifacts/
          include-hidden-files: true   # .artifacts starts with a dot
          retention-days: 7
